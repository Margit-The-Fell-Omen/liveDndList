worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80; # This stays 80 because it's inside the container
    server_name localhost; # In dev, we can use localhost or the domain

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http; # Hardcoded to http for dev
        proxy_set_header X-Forwarded-Port 81;    # The external dev port
    }

    # Swagger / OpenAPI
    location ~* ^/(swagger-ui|api-docs|v3/api-docs|swagger-resources) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Port 81;
    }

    # Frontend SPA
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }
  }
}