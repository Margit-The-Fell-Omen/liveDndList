upstream backend {
  server backend:8080;
}

upstream grafana {
  server grafana:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name live-dnd-list.duckdns.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name live-dnd-list.duckdns.org;

  ssl_certificate /etc/letsencrypt/live/live-dnd-list.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/live-dnd-list.duckdns.org/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/live-dnd-list.duckdns.org/chain.pem;

  # Backend API
  location /api/ {
      proxy_pass http://backend; # Keep this as is

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme; # Use $scheme instead of hardcoding https
      proxy_set_header X-Forwarded-Port 443;

      # This is the critical part for Spring NATIVE strategy:
      proxy_set_header X-Forwarded-Host $host;

      # Buffers for large JWTs
      proxy_buffer_size          128k;
      proxy_buffers              4 256k;
      proxy_busy_buffers_size    256k;
  }

  # Swagger / OpenAPI Endpoints
  # This covers /swagger-ui.html, /swagger-ui/, /api-docs, and /v3/api-docs
  location ~* ^/(swagger-ui|api-docs|v3/api-docs|swagger-resources) {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;

      # Swagger JSON files can be very large
      proxy_buffer_size          256k;
      proxy_buffers              4 512k;
      proxy_busy_buffers_size    512k;
  }

  # Grafana
  location /grafana/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    proxy_pass http://grafana;
  }

  # Allow upgrading to websockets (needed for live updates)
  location /grafana/api/live/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_pass http://grafana;
  }

  # Frontend SPA
  location / {
    root /usr/share/nginx/html;
    index index.html;

    try_files $uri /index.html;
  }
}
