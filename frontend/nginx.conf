server {
  listen 80;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    # This is the magic for SPAs: if a file is not found,
    # fall back to index.html to let React Router handle it.
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # It then forwards (proxies) that request to your backend container.
    # 'backend' is the service name from your docker-compose.yml.
    proxy_pass http://backend:8080;
    
    # These headers are important to pass along the original request information
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
