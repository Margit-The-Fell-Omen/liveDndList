worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;

  server {
    listen 80;
    server_name live-dnd-list.duckdns.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name live-dnd-list.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/live-dnd-list.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live-dnd-list.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/live-dnd-list.duckdns.org/chain.pem;

    # Backend API
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # THESE ARE THE CRITICAL LINES FOR SESSIONS/HTTPS
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Host $host;

      # Support for cookies
      proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Strict";
    }

    # Frontend SPA
    location / {
      root /usr/share/nginx/html;
      index index.html;

      try_files $uri /index.html;
    }
  }
}
