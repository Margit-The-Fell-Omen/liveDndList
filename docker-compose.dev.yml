# This file is for the 'dev' branch environment. It uses different ports and volumes
# to run alongside the main production environment without conflicts.
#
# NOTE: all services use `network_mode: host`. This is required because
# container-to-container (bridge) networking is broken on this host (the firewall
# drops Docker-forwarded traffic). Services therefore talk to each other over
# `localhost`. Host ports are preserved: frontend 81, backend 8081, db 5433, redis 6380.

services:

  frontend:
    build: frontend
    restart: always
    depends_on:
      - backend
    network_mode: host
    volumes:
      - ./frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_HOST: localhost
      BACKEND_PORT: 8081

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    network_mode: host
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6380
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      LOGGING_FILE_NAME: /app/logs/backend.log
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /app/logs/backend.%d{yyyy-MM-dd}.%i.log.gz
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 20MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: 14
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 500MB
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://127.0.0.1:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    volumes:
      - backend-logs-dev:/app/logs

    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: redis-server --port 6380 --requirepass ${REDIS_PASSWORD}
    network_mode: host
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "-p", "6380", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    command: postgres -p 5433
    network_mode: host
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-p", "5433" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    volumes:
      - pgdata-dev:/var/lib/postgresql

volumes:
  pgdata-dev: { }
  backend-logs-dev: { }