name: Deploy to Dev Environment
# NOTE: DO NOT FORGET ABOUT SECRETS IF MIGRATING TO OTHER SERVERS
on:
  push:
    branches:
      - dev

jobs:
  call-build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-dev:
    name: Deploy to Dev VM
    runs-on: ubuntu-latest
    needs: call-build-and-test

    steps:
      - name: Deploy Dev via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            DEV_DIR="liveDndList-dev"
            mkdir -p "$DEV_DIR"
            cd "$DEV_DIR"
            
            if [ ! -d ".git" ]; then
              git clone --branch dev https://github.com/Margit-The-Fell-Omen/liveDndList.git .
            else
              git fetch origin
              git checkout dev
              git pull origin dev
            fi
            
            echo "Deploying dev environment..."
            docker compose -f docker-compose.dev.yml --project-name livednd-dev up --build -d
            
            docker image prune -f
