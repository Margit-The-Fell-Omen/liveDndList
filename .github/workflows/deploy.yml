name: Deploy to VM

on:
  push:
    branches:
      - master

jobs:
  call-build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: call-build-and-test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -euo pipefail

            mkdir -p liveDndList
            pushd liveDndList

            git clone https://github.com/Margit-The-Fell-Omen/liveDndList.git . || git pull origin master
            docker compose up --build -d

            echo "Waiting for main compose containers to become healthy..."
            check_compose_health() {
              local compose_file="${1:-docker-compose.yml}"
              local timeout="${2:-90}"
              local elapsed=0
              local interval=5

              while [ "$elapsed" -lt "$timeout" ]; do
                local unhealthy
                unhealthy=$(docker compose -f "$compose_file" ps --format json \
                  | jq -r 'select(.State != "running" or (.Health != "" and .Health != "healthy")) | .Name' \
                  || true)

                if [ -z "$unhealthy" ]; then
                  echo "All containers healthy for $compose_file"
                  return 0
                fi

                echo "Waiting... unhealthy so far: $unhealthy"
                sleep "$interval"
                elapsed=$((elapsed + interval))
              done

              echo "Timeout reached. Container status for $compose_file:"
              docker compose -f "$compose_file" ps
              echo "Recent logs from failing containers:"
              docker compose -f "$compose_file" logs --tail=100
              return 1
            }

            check_compose_health "docker-compose.yml" 120

            pushd monitoring
            ./generate_certs.sh
            envsubst < alertmanager.yaml.tmpl > alertmanager.yaml

            docker compose -f docker-compose.yml up -d
            check_compose_health "docker-compose.yml" 60

            curl --cacert ca.crt https://127.0.0.1:8428/-/reload || true
            popd
            popd

            docker image prune -f
