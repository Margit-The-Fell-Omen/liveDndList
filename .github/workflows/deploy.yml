# .github/workflows/deploy.yml

name: Build, Test and Deploy to VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}" > ~/.ssh/ed_25519
          chmod 600 ~/.ssh/ed_25519

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          script: |
            set -euo pipefail 
            
            mkdir liveDndList || true
            
            pushd liveDndList
            git clone https://github.com/Margit-The-Fell-Omen/liveDndList.git . || git pull
            docker compose up --build -d
            popd
            
            docker image prune -f