services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    restart: always

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: "lax"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWED_ORIGINS: "https://live-dnd-list.duckdns.org"
    networks:
      - app
    restart: always

  redis:
    image: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - app
    restart: always

  frontend:
    build: ./frontend/
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot-hook.sh:/certbot-hook.sh:ro
    networks:
      - app
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot-hook.sh:/certbot-hook.sh:ro
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    entrypoint: >
      /bin/sh -c "apk add --no-cache curl && certbot certonly --manual --manual-auth-hook /certbot-hook.sh 
      --preferred-challenges dns --non-interactive --agree-tos 
      --email timtk.work@gmail.com -d live-dnd-list.duckdns.org 
      && trap exit TERM; while :; do certbot renew --manual-auth-hook /certbot-hook.sh; sleep 12h & wait $${!}; done;"

volumes:
  pgdata:

networks:
  app:
