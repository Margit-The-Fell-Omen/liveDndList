# Project identification
sonar.projectKey=Margit-The-Fell-Omen_liveDndList
sonar.organization=margit-the-fell-omen

# Project metadata
sonar.projectName=Live DnD List
sonar.projectVersion=1.0

# Path to source directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Path to compiled binaries
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding
sonar.sourceEncoding=UTF-8

# JaCoCo coverage report path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ========================================
# COVERAGE EXCLUSIONS
# ========================================

# Exclude specific packages/classes from coverage
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/enums/**,\
  **/exception/**,\
  **/exceptions/**,\
  **/*Application.java,\
  **/security/**,\
  **/cache/**,\
  **/aop/**,\
  **/client/**

# Exclude generated code
sonar.exclusions=\
  **/generated/**,\
  **/target/**

# Exclude test files from duplication detection
sonar.cpd.exclusions=\
  **/*Test.java,\
  **/*Tests.java

# Exclude specific files from all analysis
sonar.issue.ignore.multicriteria=e1,e2

# Ignore "Tests should include assertions" rule for integration tests
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*IT.java

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.java
