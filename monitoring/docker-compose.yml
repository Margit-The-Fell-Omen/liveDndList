services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.147.0-scratch@sha256:41d20b34f650d9a3c35eef963fe55b12527bf3da44d9d237d5bda91a832dcea2
    command:
      # store for 1 week only
      - -storageDataPath=/victoriametrics
      - -retentionPeriod=1w

      # scrape targets in prometheus.yaml and itself
      - -promscrape.config=/prometheus.yaml
      - -selfScrapeInterval=15s

      # require TLS for requests
      - -tls
      - -tlsCertFile=/victoriametrics.crt
      - -tlsKeyFile=/victoriametrics.key

      - -vmalert.proxyURL=http://vmalert:8880
    restart: unless-stopped
    ports:
      - 127.0.0.1:8428:8428
    volumes:
      - victoriametrics_data:/victoriametrics

      - ./monitoring/prometheus.yaml:/prometheus.yaml:ro

      - ./monitoring/victoriametrics.crt:/victoriametrics.crt:ro
      - ./monitoring/victoriametrics.key:/victoriametrics.key:ro
    extra_hosts:
      # to access node-exporter
      - host.docker.internal:host-gateway
    networks:
      - livedndlist_app

  vmalert:
    image: victoriametrics/vmalert:v1.147.0-scratch@sha256:c68fada344f3a68a7f9c73a7b1e33143e46dc6d0487def3774d27ed29e78392f
    command:
      - -datasource.url=https://victoriametrics:8428/
      - -datasource.tlsCAFile=/ca.crt
      - -remoteRead.url=https://victoriametrics:8428/
      - -remoteRead.tlsCAFile=/ca.crt
      - -remoteWrite.url=https://victoriametrics:8428/
      - -remoteWrite.tlsCAFile=/ca.crt
      - -notifier.url=http://alertmanager:9093/
      - -rule=/etc/alerts/*.yaml

      - --external.url=https://live-dnd-list.duckdns.org/grafana
      - --external.alert.source=explore?orgId=1&left={"datasource":"VictoriaMetrics","queries":[{"expr":{{.Expr|jsonEscape|queryEscape}},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}
    restart: unless-stopped
    depends_on:
      - victoriametrics
      - alertmanager
    volumes:
      - ./monitoring/alerts:/etc/alerts:ro

      - ./monitoring/ca.crt:/ca.crt:ro
    networks:
      - livedndlist_app

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    restart: unless-stopped
    command:
      - --config.file=/config/alertmanager.yaml
    env_file: ../.env
    volumes:
      - ./monitoring/telegram.tmpl.tmpl:/telegram.tmpl.tmpl
      - ./monitoring/alertmanager.yaml:/config/alertmanager.yaml
    networks:
      - livedndlist_app

  grafana:
    image: grafana/grafana-enterprise:13.1.0-distroless-slim@sha256:26cc2e537639ddd9b133c10da8a2fd74930421fd4dcebd408a262078e35315ca
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    env_file: ../.env
    environment:
      # install VictoriaMetrics plugin
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource

      GF_SECURITY_ADMIN_PASSWORD: $GRAFANA_PASSWORD

      GF_SERVER_ROOT_URL: https://live-dnd-list.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana

      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

      - ./monitoring/ca.crt:/etc/grafana/ca.crt:ro
    networks:
      - livedndlist_app

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1-distroless@sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    command:
      - --path.rootfs=/rootfs
      - --collector.filesystem.ignored-mount-points=^/(sys|proc|dev|run)($|/)
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/rootfs:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: unless-stopped
    pid: host
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - livedndlist_app

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_SOURCE_URI: $POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB?sslmode=disable
      DATA_SOURCE_USER: $POSTGRES_USER
      DATA_SOURCE_PASS: $POSTGRES_PASSWORD
    networks:
      - livedndlist_app

  redis_exporter:
    image: oliver006/redis_exporter:v1.87.0@sha256:9ca6f929a8abc518d78158757922444f1cf807661a2238f44b28c3cd08a1b652
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_ADDR: redis://$REDIS_HOST:$REDIS_PORT
    networks:
      - livedndlist_app

volumes:
  victoriametrics_data: { }
  grafana_data: { }

networks:
  livedndlist_app:
    external: true
