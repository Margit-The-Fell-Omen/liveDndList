# JWT for tests
app.jwt.secret=testSecretKeyForTestingPurposesOnlyMustBeLongEnoughForHS512Algorithm1234567890
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
# Disable security for tests
spring.security.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.data.redis.repositories.enabled=false
logging.level.orghibernate.SQL=WARN
logging.level.orghibernate.orm.jdbc.bind=WARN
logging.level.dev.ushki.livedndlist=INFO
# features
features.file-loader.enabled=false
