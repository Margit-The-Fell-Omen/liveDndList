spring.application.name=live-dnd-list
# PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
# PSQL Debug
#spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=WARN
#logging.level.org.hibernate.tool.hbm2ddl=DEBUG
#logging.level.org.hibernate.type.descriptor.sql=TRACE
# spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.type=DEBUG
#logging.level.org.hibernate.boot=DEBUG
#logging.level.org.hibernate.mapping=DEBUG
#logging.level.org.hibernate.stat=DEBUG
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED_ENUM
# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000
# Server
server.port=8080
server.forward-headers-strategy=framework
# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=dev.ushki.livedndlist.controller,dev.ushki.livedndlist.dto
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false
# logs
logging.level.root=INFO
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# Rate Limiting ??? Open5e API
open5e.rate-limit.delay-ms=200
open5e.rate-limit.max-retries=3
open5e.rate-limit.retry-delay-ms=1000
# Monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always